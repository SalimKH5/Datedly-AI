[package]
name = "datedly"
version = "0.1.0"
edition = "2021"
description = "Datedly AI backend: calendar engine, storage, AI providers"

[lib]
path = "src/lib.rs"

[[bin]]
name = "datedly-server"
path = "src/main.rs"

[[bin]]
name = "datedly-publish"
path = "src/bin/publish.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.10"

[dev-dependencies]
tempfile = "3"
